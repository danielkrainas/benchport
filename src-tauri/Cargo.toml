[package]
name = "toybox"
version = "0.1.0"
description = "A lightweight, brandable launcher for distributing prototype game builds"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "toybox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "rt"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma"] }
feed-rs = "2"
url = "2"
base64 = "0.22"
tauri-plugin-log = "2"
log = "0.4"
ed25519-dalek = "2"
fs4 = "0.13"

# Forwards toybox:// links (and launch args) to the already-running launcher.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
# Replacing a running .exe needs special handling on Windows.
self-replace = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
