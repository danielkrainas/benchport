<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toybox</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <div class="brand-logo" id="brand-logo"></div>
      <span class="brand-name" id="brand-name">Toybox</span>
    </div>
    <div class="nav-arrows">
      <button class="tb-btn" data-action="back" title="Back"></button>
      <button class="tb-btn" data-action="forward" title="Forward"></button>
    </div>
    <div class="search" id="search">
      <span class="search-ic"></span>
      <input id="search-input" type="text" placeholder="Search games" autocomplete="off" spellcheck="false" />
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <div class="tb-spacer" data-tauri-drag-region></div>
    <div class="win-controls">
      <button class="win-btn" data-action="win-min" title="Minimize"></button>
      <button class="win-btn" data-action="win-max" title="Maximize"></button>
      <button class="win-btn close" data-action="win-close" title="Close"></button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="overlay gate" id="gate" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
</body>
</html>
